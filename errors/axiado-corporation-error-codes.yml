name: Axiado SecureStack ADK status / error codes
api: Axiado SecureStack ADK
format: vendor-status-codes
note: Axiado publishes no HTTP/REST API and therefore no RFC 9457 problem types. SecureStack ADK is an
  embedded C API whose functions return a 32-bit AX_STATUS value; this catalog captures that published
  registry verbatim from the developer hub.
envelope:
  type: AX_STATUS
  width_bits: 32
  encoding: upper 20 bits = module (block) code, lower 12 bits = status code
  success_value: 0x00000000 (zero is success; AX_STATUS_SUCCESS is defined as 0x01010000 in the global
    block)
  header: include/error/ax_status.h
  allocation: Block codes are centrally allocated by Axiado to avoid conflicting status codes across modules.
  docs: https://devhub.axiado.com/reference/status-codes
module_count: 7
code_count: 98
