note: >-
  Axiado publishes no client library on any public package registry — npm, PyPI, crates.io and
  RubyGems were all searched for "axiado" on 2026-07-31 and returned zero results. The one
  first-party SDK is the SecureStack ADK, distributed as source by Axiado customer engineering
  and cross-compiled into TCU firmware. It is a real, publicly documented SDK with a full API
  reference, so it is recorded here; it is simply not registry-distributed.
packages:
- language: c
  registry: vendor
  name: Axiado SecureStack ADK
  url: https://devhub.axiado.com/reference
  availability: on-request
  install: >-
    Source distribution — "To download Axiado ADK sources and associated binary, please contact
    Axiado customer engineering representative." Built as a Zephyr external module with
    `west build -b ax3000_hapsec . -DPLATFORM=SCM3000 --pristine`.
  requires:
  - Zephyr SDK 0.14.0
  - Zephyr RTOS 3.0.0 (hardened, Axiado-supplied)
  - ARM GNU toolchain (arm-none-eabi, gcc-arm-11.2-2022.02 for baremetal Cortex-M55)
  - Python 3.8
  official: true
  docs: https://devhub.axiado.com/docs/getting-started-with-securestack-adk
