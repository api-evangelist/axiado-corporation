aid: axiado-corporation
name: Axiado Corporation
description: 'Axiado Corporation is a San Jose, California semiconductor company building
  hardware-anchored, AI-driven platform security for AI data centers, cloud infrastructure,
  5G networks and disaggregated compute. Its flagship Trusted Control/Compute Unit
  (TCU) — the AX3000 family and the second-generation AX3080 — collapses the baseboard
  management controller (BMC), hardware root of trust, trusted platform module (TPM),
  hardware security module, firewall and LAN-on-motherboard into a single system-on-chip
  with on-die AI/ML engines for dynamic threat management. Axiado ships OCP DC-SCM
  secure control modules (Smart-SCM3002, SCM3003, SCM3080-MT) alongside the SecureStack
  ADK, a Zephyr RTOS software development kit whose public API reference documents
  crypto, key management, X.509 certificate, BMC control, flash, SPI, DMA and OS-abstraction
  engines, plus OpenBMC-based out-of-band management running on the TCU. Developer
  documentation is published at devhub.axiado.com. The API surface is an embedded C/C++
  SDK and on-device management interface — Axiado publishes no hosted public web API
  and no OpenAPI definition.'
