apis:
- name: Axiado SecureStack ADK
  description: 'The SecureStack Application Development Kit is Axiado''s public API
    for building secure applications on the AX3000 / AX2000 TCU family. It exposes
    thread-safe engine interfaces for crypto (AES, SHA/SHA-3, RSA, ECC, TRNG), X.509
    certificate management, root key management and key store, BMC boot control and
    status, NOR flash, SPI, DMA, register access, reset management, secure-coding primitives
    (safe math, hardened booleans) and an OS abstraction layer (memory, timers, mutexes,
    semaphores, critical sections). Applications run in the TCU Secure Enclave under
    a hardened Zephyr RTOS 3.0.0, in privileged or sandboxed non-privileged mode.'
